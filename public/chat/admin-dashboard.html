<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Chat - Administration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 24px;
            border-radius: 12px;
            margin-bottom: 24px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            color: #2d3748;
            margin-bottom: 8px;
        }

        .header p {
            color: #718096;
            font-size: 14px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .card-title {
            font-size: 14px;
            font-weight: 600;
            color: #718096;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card-value {
            font-size: 32px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 8px;
        }

        .card-meta {
            font-size: 12px;
            color: #a0aec0;
        }

        .stat-up {
            color: #48bb78;
        }

        .stat-down {
            color: #f56565;
        }

        .chart-container {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 24px;
        }

        .chart-title {
            font-size: 16px;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 16px;
        }

        .conversation-list {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .conversation-item {
            padding: 16px;
            border-bottom: 1px solid #e2e8f0;
            cursor: pointer;
            transition: background 0.2s;
        }

        .conversation-item:hover {
            background: #f7fafc;
        }

        .conversation-item:last-child {
            border-bottom: none;
        }

        .conversation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .conversation-question {
            font-weight: 600;
            color: #2d3748;
            font-size: 14px;
        }

        .conversation-source {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
            background: #bee3f8;
            color: #2c5282;
        }

        .conversation-time {
            font-size: 11px;
            color: #a0aec0;
        }

        .conversation-response {
            font-size: 13px;
            color: #718096;
            margin-top: 8px;
            line-height: 1.4;
            max-height: 40px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rating-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 8px;
        }

        .rating-positive {
            background: #c6f6d5;
            color: #22543d;
        }

        .rating-negative {
            background: #fed7d7;
            color: #742a2a;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #a0aec0;
        }

        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #e2e8f0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .search-box {
            margin-bottom: 16px;
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
        }

        .search-box button {
            padding: 10px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .search-box button:hover {
            background: #5a67d8;
        }

        .export-btn {
            background: #48bb78;
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        .export-btn:hover {
            background: #38a169;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Dashboard Chat</h1>
            <p>Gestion et analyse des conversations du chatbot</p>
        </div>

        <!-- Stats Cards -->
        <div class="grid" id="stats-container">
            <div class="card">
                <div class="card-title">Total Conversations</div>
                <div class="card-value" id="total-conversations">-</div>
                <div class="card-meta">depuis le début</div>
            </div>

            <div class="card">
                <div class="card-title">Réponses Moyennes</div>
                <div class="card-value" id="avg-response" style="font-size: 18px;">-</div>
                <div class="card-meta">longueur moyenne des réponses</div>
            </div>

            <div class="card">
                <div class="card-title">Rating Moyen</div>
                <div class="card-value" id="avg-rating">-</div>
                <div class="card-meta"><span id="rating-status" class="stat-up">↑</span> par rapport au précédent</div>
            </div>

            <div class="card">
                <div class="card-title">Source Principale</div>
                <div class="card-value" id="top-source" style="font-size: 18px;">-</div>
                <div class="card-meta">source la plus utilisée</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button class="export-btn" onclick="exportData()">📥 Exporter Données</button>
            <button class="export-btn" style="background: #ed8936;" onclick="refreshData()">🔄 Actualiser</button>
        </div>

        <!-- Conversations List -->
        <div class="chart-container">
            <div class="chart-title">Conversations Récentes</div>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Chercher une conversation...">
            </div>
            <div class="conversation-list" id="conversations-container">
                <div class="loading">
                    <div class="spinner"></div>
                    <p style="margin-top: 12px;">Chargement des conversations...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadChatData() {
            try {
                const response = await fetch('../../app/api/chat-admin.php?action=get_data');
                const data = await response.json();
                
                if (data.success) {
                    displayStats(data.patterns);
                    displayConversations(data.conversations);
                }
            } catch (error) {
                console.error('Error loading chat data:', error);
                document.getElementById('conversations-container').innerHTML = 
                    `<div class="loading" style="color: #f56565;">Erreur lors du chargement des données</div>`;
            }
        }

        function displayStats(patterns) {
            document.getElementById('total-conversations').textContent = patterns.total_conversations;
            document.getElementById('avg-response').textContent = patterns.avg_response_length + ' car';
            document.getElementById('avg-rating').textContent = patterns.avg_rating.toFixed(2);

            const sources = patterns.most_common_sources;
            const topSource = Object.keys(sources).reduce((a, b) => sources[a] > sources[b] ? a : b);
            document.getElementById('top-source').textContent = topSource;
        }

        function displayConversations(conversations) {
            const container = document.getElementById('conversations-container');
            
            if (conversations.length === 0) {
                container.innerHTML = '<div class="loading">Aucune conversation enregistrée</div>';
                return;
            }

            container.innerHTML = conversations
                .slice(-20) // Dernières 20
                .reverse()
                .map(conv => `
                    <div class="conversation-item">
                        <div class="conversation-header">
                            <div class="conversation-question">${escapeHtml(conv.question || conv.message)}</div>
                            <div style="display: flex; gap: 8px; align-items: center;">
                                <span class="conversation-source">${conv.source || 'unknown'}</span>
                                <span class="conversation-time">${new Date(conv.timestamp).toLocaleString()}</span>
                            </div>
                        </div>
                        <div class="conversation-response">${escapeHtml(conv.response || conv.message || '')}</div>
                        ${conv.rating !== 0 && conv.rating ? `
                            <span class="rating-badge ${conv.rating > 0 ? 'rating-positive' : 'rating-negative'}">
                                ${conv.rating > 0 ? '👍 Utile' : '👎 Pas utile'}
                            </span>
                        ` : ''}
                    </div>
                `)
                .join('');
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;', '<': '&lt;', '>': '&gt;',
                '"': '&quot;', "'": '&#039;'
            };
            return (text || '').replace(/[&<>"']/g, m => map[m]);
        }

        function exportData() {
            const data = localStorage.getItem('chat_history');
            if (data) {
                const element = document.createElement('a');
                element.setAttribute('href', 'data:text/plain;charset=utf-8,' + encodeURIComponent(data));
                element.setAttribute('download', `chat_history_${new Date().toISOString().slice(0, 10)}.json`);
                element.style.display = 'none';
                document.body.appendChild(element);
                element.click();
                document.body.removeChild(element);
            } else {
                alert('Aucune donnée à exporter');
            }
        }

        function refreshData() {
            document.getElementById('conversations-container').innerHTML = 
                '<div class="loading"><div class="spinner"></div><p style="margin-top: 12px;">Actualisation...</p></div>';
            loadChatData();
        }

        // Chargement initial
        loadChatData();

        // Actualiser chaque 30 secondes
        setInterval(loadChatData, 30000);

        // Recherche en temps réel
        document.getElementById('search-input')?.addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase();
            const items = document.querySelectorAll('.conversation-item');
            
            items.forEach(item => {
                const text = item.textContent.toLowerCase();
                item.style.display = text.includes(query) ? 'block' : 'none';
            });
        });
    </script>
</body>
</html>
